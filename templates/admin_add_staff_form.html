{% extends 'layout.html' %}
{% block title %}Add New Staff Member{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-[#f8fafc] py-12 px-4 sm:px-6 lg:px-8 relative overflow-hidden">
    
    <!-- Sophisticated Background Elements -->
    <div class="absolute inset-0 z-0">
        <div class="absolute top-[-10%] left-[-5%] w-96 h-96 bg-gradient-to-br from-indigo-200/40 to-purple-200/40 rounded-full blur-3xl animate-blob"></div>
        <div class="absolute bottom-[-10%] right-[-5%] w-96 h-96 bg-gradient-to-tr from-blue-200/40 to-teal-200/40 rounded-full blur-3xl animate-blob animation-delay-2000"></div>
        <div class="absolute inset-0 bg-[url('https://play.tailwindcss.com/img/beams.png')] bg-center [mask-image:linear-gradient(180deg,white,rgba(255,255,255,0))]"></div>
    </div>

    <!-- Main Card -->
    <div class="max-w-xl w-full space-y-8 relative z-10">
        <div class="bg-white/80 backdrop-blur-xl p-8 md:p-12 rounded-[2.5rem] shadow-[0_20px_50px_rgba(0,0,0,0.05)] border border-white">
            
            <!-- Header Section -->
            <div class="text-center mb-10">
                <div class="inline-flex items-center justify-center w-20 h-20 rounded-3xl bg-gradient-to-tr from-indigo-600 to-violet-500 shadow-lg shadow-indigo-200 mb-6 transform transition-transform hover:scale-110 duration-500">
                    <i class="fas fa-user-plus text-3xl text-white"></i>
                </div>
                <h2 class="text-3xl font-black text-slate-800 tracking-tight mb-2">Staff Onboarding</h2>
                <p class="text-slate-500 font-medium">Register new medical and administrative staff members</p>
            </div>

            <form class="space-y-5" action="{{ url_for('admin_add_staff') }}" method="POST">
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <!-- Name -->
                    <div class="md:col-span-2">
                        <label class="block text-sm font-semibold text-slate-700 mb-2 ml-1">Full Name</label>
                        <div class="relative group">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400 group-focus-within:text-indigo-500 transition-colors">
                                <i class="fas fa-user-circle"></i>
                            </div>
                            <input id="name" name="name" type="text" required 
                                class="block w-full pl-11 pr-4 py-3.5 bg-slate-50 border border-slate-200 text-slate-900 rounded-2xl focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500 focus:bg-white transition-all outline-none placeholder:text-slate-400" 
                                placeholder="John Doe">
                        </div>
                    </div>

                    <!-- Email -->
                    <div class="md:col-span-2">
                        <label class="block text-sm font-semibold text-slate-700 mb-2 ml-1">Work Email</label>
                        <div class="relative group">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400 group-focus-within:text-indigo-500 transition-colors">
                                <i class="fas fa-envelope"></i>
                            </div>
                            <input id="email" name="email" type="email" required 
                                class="block w-full pl-11 pr-4 py-3.5 bg-slate-50 border border-slate-200 text-slate-900 rounded-2xl focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500 focus:bg-white transition-all outline-none placeholder:text-slate-400" 
                                placeholder="j.doe@hospital.com">
                        </div>
                    </div>

                    <!-- Role Selection -->
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2 ml-1">Department Role</label>
                        <div class="relative group">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400 group-focus-within:text-indigo-500 transition-colors">
                                <i class="fas fa-id-badge"></i>
                            </div>
                            <select id="role" name="role" required 
                                class="block w-full pl-11 pr-10 py-3.5 bg-slate-50 border border-slate-200 text-slate-900 rounded-2xl focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500 focus:bg-white transition-all outline-none appearance-none cursor-pointer">
                                <option value="" disabled selected>Select Role</option>
                                <option value="Nurse">Nurse</option>
                                <option value="Receptionist">Receptionist</option>
                                <option value="Technician">Technician</option>
                                <option value="Pharmacist">Pharmacist</option>
                                <option value="Admin Staff">Admin Staff</option>
                            </select>
                            <div class="absolute inset-y-0 right-0 flex items-center pr-4 pointer-events-none text-slate-400">
                                <i class="fas fa-chevron-down text-xs"></i>
                            </div>
                        </div>
                    </div>

                    <!-- Phone Number -->
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2 ml-1">Phone Number</label>
                        <div class="relative group">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400 group-focus-within:text-indigo-500 transition-colors">
                                <i class="fas fa-phone"></i>
                            </div>
                            <input id="phone" name="phone" type="tel" 
                                class="block w-full pl-11 pr-4 py-3.5 bg-slate-50 border border-slate-200 text-slate-900 rounded-2xl focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500 focus:bg-white transition-all outline-none placeholder:text-slate-400" 
                                placeholder="+1 (555) 000-0000">
                        </div>
                    </div>

                    <!-- Password -->
                    <div class="md:col-span-2">
                        <label class="block text-sm font-semibold text-slate-700 mb-2 ml-1">Assign Temporary Password</label>
                        <div class="relative group">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400 group-focus-within:text-indigo-500 transition-colors">
                                <i class="fas fa-lock"></i>
                            </div>
                            <input id="password" name="password" type="password" required 
                                class="block w-full pl-11 pr-4 py-3.5 bg-slate-50 border border-slate-200 text-slate-900 rounded-2xl focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500 focus:bg-white transition-all outline-none placeholder:text-slate-400" 
                                placeholder="••••••••••••">
                        </div>
                    </div>
                </div>

                <!-- Actions -->
                <div class="flex flex-col sm:flex-row gap-4 pt-6">
                    <a href="{{ url_for('admin_dashboard') }}" 
                        class="flex-1 inline-flex justify-center items-center px-6 py-3.5 border border-slate-200 text-sm font-bold rounded-2xl text-slate-600 bg-white hover:bg-slate-50 hover:border-slate-300 transition-all duration-200">
                        Cancel
                    </a>
                    <button type="submit" 
                        class="flex-[2] relative group overflow-hidden inline-flex justify-center items-center px-6 py-3.5 rounded-2xl text-white bg-indigo-600 font-bold text-sm transition-all duration-300 hover:bg-indigo-700 hover:shadow-xl hover:shadow-indigo-200 active:scale-[0.98]">
                        <span class="relative z-10 flex items-center">
                            <i class="fas fa-check-circle mr-2 opacity-80 group-hover:scale-110 transition-transform"></i>
                            Complete Onboarding
                        </span>
                        <div class="absolute inset-0 bg-gradient-to-r from-indigo-600 to-violet-600 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                    </button>
                </div>
            </form>
        </div>

        <!-- Footer Note -->
        <p class="text-center text-slate-400 text-xs font-medium uppercase tracking-widest">
            Security Protocol: All staff will be prompted to change password on first login
        </p>
    </div>
</div>

<style>
    /* Smooth Blob Animation */
    @keyframes blob {
        0% { transform: translate(0px, 0px) scale(1); }
        33% { transform: translate(30px, -50px) scale(1.1); }
        66% { transform: translate(-20px, 20px) scale(0.9); }
        100% { transform: translate(0px, 0px) scale(1); }
    }
    .animate-blob {
        animation: blob 10s infinite alternate cubic-bezier(0.45, 0, 0.55, 1);
    }
    .animation-delay-2000 {
        animation-delay: 2s;
    }

    /* Custom Input Shadow on Focus */
    input:focus {
        box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.1), 0 4px 6px -2px rgba(79, 70, 229, 0.05);
    }

    /* Smooth Font Rendering */
    body {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
    }
</style>
{% endblock %}
