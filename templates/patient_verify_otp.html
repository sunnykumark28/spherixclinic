<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP - Spherix Clinic</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --primary-glow: #0d6efd;
        }

        body { 
            /* Dark gradient background to make the glass effect pop */
            background: radial-gradient(circle at top right, #1e293b, #0f172a, #000000);
            background-attachment: fixed;
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            margin: 0;
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
            width: 100%;
        }

        .form-control {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid var(--glass-border);
            color: #fff;
            border-radius: 12px;
            padding: 12px;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            background: rgba(255, 255, 255, 0.12);
            border-color: var(--primary-glow);
            box-shadow: 0 0 15px rgba(13, 110, 253, 0.3);
            color: #fff;
        }

        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .btn-primary {
            background: var(--primary-glow);
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }

        .btn-primary:hover {
            background: #0b5ed7;
            transform: translateY(-1px);
            box-shadow: 0 5px 15px rgba(13, 110, 253, 0.4);
        }

        .text-muted {
            color: rgba(255, 255, 255, 0.6) !important;
        }

        #resendLink, .change-email-link {
            color: #4dabff;
            font-size: 0.9rem;
            transition: 0.3s;
        }

        #resendLink:hover {
            color: #82c4ff;
        }

        /* OTP Input specific styling */
        #otp {
            letter-spacing: 10px;
            font-size: 1.5rem;
            font-weight: bold;
        }

        /* Alert Styling for Glassmorphism */
        .alert {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--glass-border);
            color: #fff;
            border-radius: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="glass-card">
                    <div class="text-center mb-4">
                        <h3 class="fw-bold">Verify Your Email</h3>
                        <p class="text-muted">We've sent a 6-digit code to your email.</p>
                    </div>
                    
                    {% with messages = get_flashed_messages(with_categories=true) %}
                        {% if messages %}
                            {% for category, message in messages %}
                                <div class="alert alert-info mb-3">{{ message }}</div>
                            {% endfor %}
                        {% endif %}
                    {% endwith %}

                    <form method="POST">
                        <div class="mb-4">
                            <label for="otp" class="form-label text-muted">Enter OTP</label>
                            <input type="text" class="form-control form-control-lg text-center" id="otp" name="otp" maxlength="6" required placeholder="000000">
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Verify & Create Account</button>
                    </form>
                    
                    <div class="d-flex justify-content-between mt-4">
                        <a href="{{ url_for('patient_resend_otp') }}" id="resendLink" class="text-decoration-none">Resend OTP</a>
                        <a href="{{ url_for('patient_signup') }}" class="text-decoration-none text-muted change-email-link">Change Email</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            let timeLeft = 30;
            const resendLink = document.getElementById('resendLink');
            const originalText = "Resend OTP";
            
            function updateTimer() {
                if (timeLeft > 0) {
                    resendLink.innerText = `Resend in ${timeLeft}s`;
                    resendLink.style.pointerEvents = 'none';
                    resendLink.style.opacity = '0.5';
                    timeLeft--;
                    setTimeout(updateTimer, 1000);
                } else {
                    resendLink.innerText = originalText;
                    resendLink.style.pointerEvents = 'auto';
                    resendLink.style.opacity = '1';
                }
            }
            
            updateTimer();
        });
    </script>
</body>
</html>
