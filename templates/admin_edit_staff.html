{% extends 'layout.html' %}
{% block title %}Edit Staff Member{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-[#f8fafc] py-12 px-4 sm:px-6 lg:px-8 relative overflow-hidden">
    
    <!-- Sophisticated Background Elements -->
    <div class="absolute inset-0 z-0">
        <div class="absolute top-[-10%] right-[-5%] w-96 h-96 bg-gradient-to-br from-blue-200/40 to-indigo-200/40 rounded-full blur-3xl animate-blob"></div>
        <div class="absolute bottom-[-10%] left-[-5%] w-96 h-96 bg-gradient-to-tr from-purple-200/40 to-pink-200/40 rounded-full blur-3xl animate-blob animation-delay-2000"></div>
        <div class="absolute inset-0 bg-[url('https://play.tailwindcss.com/img/beams.png')] bg-center [mask-image:linear-gradient(180deg,white,rgba(255,255,255,0))]"></div>
    </div>

    <!-- Main Card -->
    <div class="max-w-xl w-full space-y-8 relative z-10">
        <div class="bg-white/80 backdrop-blur-xl p-8 md:p-12 rounded-[2.5rem] shadow-[0_20px_50px_rgba(0,0,0,0.05)] border border-white">
            
            <!-- Header Section -->
            <div class="text-center mb-10">
                <div class="inline-flex items-center justify-center w-20 h-20 rounded-3xl bg-gradient-to-tr from-blue-600 to-indigo-500 shadow-lg shadow-blue-200 mb-6 transform transition-transform hover:rotate-6 duration-500">
                    <i class="fas fa-user-pen text-3xl text-white"></i>
                </div>
                <h2 class="text-3xl font-black text-slate-800 tracking-tight mb-2">Edit Staff Profile</h2>
                <p class="text-slate-500 font-medium">Update account details for <span class="text-indigo-600 font-bold">{{ staff.name }}</span></p>
            </div>

            <form class="space-y-5" method="POST">
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <!-- Name -->
                    <div class="md:col-span-2">
                        <label class="block text-sm font-semibold text-slate-700 mb-2 ml-1">Full Name</label>
                        <div class="relative group">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400 group-focus-within:text-blue-500 transition-colors">
                                <i class="fas fa-user-circle"></i>
                            </div>
                            <input id="name" name="name" type="text" required value="{{ staff.name }}"
                                class="block w-full pl-11 pr-4 py-3.5 bg-slate-50 border border-slate-200 text-slate-900 rounded-2xl focus:ring-4 focus:ring-blue-500/10 focus:border-blue-500 focus:bg-white transition-all outline-none placeholder:text-slate-400">
                        </div>
                    </div>

                    <!-- Email -->
                    <div class="md:col-span-2">
                        <label class="block text-sm font-semibold text-slate-700 mb-2 ml-1">Email Address</label>
                        <div class="relative group">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400 group-focus-within:text-blue-500 transition-colors">
                                <i class="fas fa-envelope"></i>
                            </div>
                            <input id="email" name="email" type="email" required value="{{ staff.email }}"
                                class="block w-full pl-11 pr-4 py-3.5 bg-slate-50 border border-slate-200 text-slate-900 rounded-2xl focus:ring-4 focus:ring-blue-500/10 focus:border-blue-500 focus:bg-white transition-all outline-none">
                        </div>
                    </div>

                    <!-- Role Selection -->
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2 ml-1">Department Role</label>
                        <div class="relative group">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400 group-focus-within:text-blue-500 transition-colors">
                                <i class="fas fa-id-badge"></i>
                            </div>
                            <select id="role" name="role" required 
                                class="block w-full pl-11 pr-10 py-3.5 bg-slate-50 border border-slate-200 text-slate-900 rounded-2xl focus:ring-4 focus:ring-blue-500/10 focus:border-blue-500 focus:bg-white transition-all outline-none appearance-none cursor-pointer">
                                <option value="Nurse" {% if staff.role == 'Nurse' %}selected{% endif %}>Nurse</option>
                                <option value="Receptionist" {% if staff.role == 'Receptionist' %}selected{% endif %}>Receptionist</option>
                                <option value="Technician" {% if staff.role == 'Technician' %}selected{% endif %}>Technician</option>
                                <option value="Pharmacist" {% if staff.role == 'Pharmacist' %}selected{% endif %}>Pharmacist</option>
                                <option value="Admin Staff" {% if staff.role == 'Admin Staff' %}selected{% endif %}>Admin Staff</option>
                            </select>
                            <div class="absolute inset-y-0 right-0 flex items-center pr-4 pointer-events-none text-slate-400">
                                <i class="fas fa-chevron-down text-xs"></i>
                            </div>
                        </div>
                    </div>

                    <!-- Phone Number -->
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2 ml-1">Phone Number</label>
                        <div class="relative group">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400 group-focus-within:text-blue-500 transition-colors">
                                <i class="fas fa-phone"></i>
                            </div>
                            <input id="phone" name="phone" type="tel" value="{{ staff.phone or '' }}"
                                class="block w-full pl-11 pr-4 py-3.5 bg-slate-50 border border-slate-200 text-slate-900 rounded-2xl focus:ring-4 focus:ring-blue-500/10 focus:border-blue-500 focus:bg-white transition-all outline-none">
                        </div>
                    </div>
                </div>

                <!-- Actions -->
                <div class="flex flex-col sm:flex-row gap-4 pt-6">
                    <a href="{{ url_for('admin_dashboard') }}" 
                        class="flex-1 inline-flex justify-center items-center px-6 py-3.5 border border-slate-200 text-sm font-bold rounded-2xl text-slate-600 bg-white hover:bg-slate-50 hover:border-slate-300 transition-all duration-200">
                        Discard
                    </a>
                    <button type="submit" 
                        class="flex-[2] relative group overflow-hidden inline-flex justify-center items-center px-6 py-3.5 rounded-2xl text-white bg-blue-600 font-bold text-sm transition-all duration-300 hover:bg-blue-700 hover:shadow-xl hover:shadow-blue-200 active:scale-[0.98]">
                        <span class="relative z-10 flex items-center">
                            <i class="fas fa-save mr-2 opacity-80 group-hover:animate-pulse"></i>
                            Update Changes
                        </span>
                        <div class="absolute inset-0 bg-gradient-to-r from-blue-600 to-indigo-600 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                    </button>
                </div>
            </form>
        </div>

        <!-- System Tag -->
        <div class="flex items-center justify-center space-x-2 text-slate-400">
            <span class="h-px w-8 bg-slate-200"></span>
            <span class="text-[10px] font-bold uppercase tracking-[0.2em]">System ID: STAFF-{{ staff.id }}</span>
            <span class="h-px w-8 bg-slate-200"></span>
        </div>
    </div>
</div>

<style>
    @keyframes blob {
        0% { transform: translate(0px, 0px) scale(1); }
        33% { transform: translate(30px, -50px) scale(1.1); }
        66% { transform: translate(-20px, 20px) scale(0.9); }
        100% { transform: translate(0px, 0px) scale(1); }
    }
    .animate-blob {
        animation: blob 10s infinite alternate cubic-bezier(0.45, 0, 0.55, 1);
    }
    .animation-delay-2000 {
        animation-delay: 2s;
    }
    body {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
    }
</style>
{% endblock %}
