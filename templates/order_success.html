{% extends 'layout.html' %}

{% block title %}Order Successful{% endblock %}

{% block content %}
<div class="text-center py-20 px-4">
    <div class="max-w-lg mx-auto bg-white p-10 rounded-xl shadow-2xl border border-green-200">
        <i class="fas fa-check-circle text-6xl text-green-500 mb-6 animate-pulse"></i>
        <h1 class="text-4xl font-extrabold text-gray-800 mb-4">Thank You For Your Order!</h1>
        <p class="text-lg text-gray-600 mb-8">
            Your order #{{ order_id }} has been placed successfully. We will notify you once it has been shipped.
        </p>
        <div class="flex justify-center gap-4">
            <a href="{{ url_for('patient_dashboard') }}" class="bg-sky-600 text-white font-semibold py-3 px-8 rounded-full hover:bg-sky-700 transition-all duration-300 shadow-lg">
                View My Dashboard
            </a>
            <a href="{{ url_for('medical_shop') }}" class="bg-gray-200 text-gray-800 font-semibold py-3 px-8 rounded-full hover:bg-gray-300 transition-all duration-300">
                Continue Shopping
            </a>
        </div>
    </div>
</div>
{% endblock %}
