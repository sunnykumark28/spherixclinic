<!-- templates/components/review_card.html -->
<div class="p-6 rounded-2xl bg-slate-50 border border-slate-100 hover:bg-white hover:border-slate-200 transition-all">
    <div class="flex items-center justify-between mb-4">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-emerald-600 flex items-center justify-center text-white font-bold shadow-md shadow-emerald-200">
                {{ review.patient_name[0]|upper if review.patient_name else 'P' }}
            </div>
            <div>
                <p class="font-bold text-slate-800 text-sm">{{ review.patient_name }}</p>
                <p class="text-xs text-slate-400">{{ review.created_at.strftime('%B %d, %Y') }}</p>
            </div>
        </div>
        <div class="flex text-[var(--color-rating)] bg-white px-2 py-1 rounded-lg shadow-sm">
            {% for i in range(review.rating|int) %}<i class="fas fa-star text-xs"></i>{% endfor %}
            {% for i in range(5 - review.rating|int) %}<i class="far fa-star text-xs"></i>{% endfor %}
        </div>
    </div>
    <p class="text-slate-600 text-sm leading-relaxed italic">"{{ review.comment }}"</p>
</div>
