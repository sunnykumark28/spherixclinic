<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password - DEV AI+</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts (Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <style>
        :root {
            --primary-accent: #00d2ff;
            --secondary-accent: #3a7bd5;
            --glass-white: rgba(255, 255, 255, 0.05);
            --border-color: rgba(255, 255, 255, 0.12);
        }

        body { 
            background-color: #000000; /* Fully black background */
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            overflow: hidden;
        }

        /* Subtle glowing orb in the background to help the glass effect pop */
        body::before {
            content: "";
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(58, 123, 213, 0.15) 0%, rgba(0,0,0,0) 70%);
            top: 20%;
            left: 30%;
            z-index: -1;
        }

        .glass-card {
            background: var(--glass-white);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--border-color);
            border-radius: 28px;
            padding: 45px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header-icon {
            font-size: 2.5rem;
            background: linear-gradient(to right, var(--primary-accent), var(--secondary-accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 15px;
        }

        h3 {
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 10px;
        }

        .text-muted {
            color: rgba(255, 255, 255, 0.5) !important;
            font-size: 0.9rem;
        }

        .form-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 8px;
            margin-left: 5px;
        }

        .form-control {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: #fff;
            border-radius: 12px;
            padding: 12px 15px;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--primary-accent);
            box-shadow: 0 0 0 4px rgba(0, 210, 255, 0.15);
            color: #fff;
        }

        /* Specific style for OTP input */
        input[name="otp"] {
            letter-spacing: 8px;
            font-weight: 700;
            font-size: 1.2rem;
            text-transform: uppercase;
        }

        .btn-reset {
            background: linear-gradient(135deg, var(--primary-accent) 0%, var(--secondary-accent) 100%);
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-weight: 700;
            color: white;
            margin-top: 15px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-reset:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 210, 255, 0.3);
            color: white;
        }

        .btn-reset:active {
            transform: translateY(0);
        }

        .alert {
            background: rgba(220, 53, 69, 0.1);
            border: 1px solid rgba(220, 53, 69, 0.2);
            color: #ff8e97;
            border-radius: 12px;
            font-size: 0.9rem;
        }

        .input-group-text {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: rgba(255, 255, 255, 0.5);
            border-radius: 12px;
        }
    </style>
</head>
<body>

    <div class="glass-card text-center">
        <div class="header-icon">
            <i class="bi bi-shield-lock-fill"></i>
        </div>
        <h3>Secure Reset</h3>
        <p class="text-muted mb-4">Please enter the code sent to your email and choose a strong password.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} text-start mb-3">
                        <i class="bi bi-exclamation-circle-fill me-2"></i> {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" class="text-start">
            <div class="mb-3">
                <label class="form-label">Verification Code</label>
                <input type="text" name="otp" class="form-control text-center" maxlength="6" required placeholder="••••••">
            </div>

            <div class="mb-3">
                <label class="form-label">New Password</label>
                <div class="input-group">
                    <input type="password" name="password" class="form-control" required placeholder="Min. 8 characters">
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label">Confirm Password</label>
                <div class="input-group">
                    <input type="password" name="confirm_password" class="form-control" required placeholder="Repeat password">
                </div>
            </div>

            <button type="submit" class="btn btn-reset w-100">
                Update Password <i class="bi bi-arrow-right ms-2"></i>
            </button>
        </form>

        <div class="mt-4">
            <a href="#" class="text-decoration-none text-muted small">
                <i class="bi bi-question-circle me-1"></i> Need help? Contact support
            </a>
        </div>
    </div>

</body>
</html>
