<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Doctor OTP - Spherix Clinic</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { 
            background-color: #000000; /* slate-50 */
            display: flex; align-items: center; justify-content: center; height: 100vh; 
            font-family: 'Inter', sans-serif;
        }
        .card { border: none; border-radius: 15px; box-shadow: 0 10px 25px rgba(30, 41, 59, 0.1); }
        .btn-primary { background-color: #0f172a; border: none; padding: 10px; font-weight: 600; } /* slate-900 */
        .btn-primary:hover { background-color: #1e293b; } /* slate-800 */
        .text-slate-900 { color: #0f172a; }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card p-4">
                    <div class="text-center mb-4">
                        <h3 class="fw-bold text-slate-900">Verify Email</h3>
                        <p class="text-muted">We've sent a 6-digit code to your institutional email.</p>
                    </div>
                    
                    {% with messages = get_flashed_messages(with_categories=true) %}
                        {% if messages %}
                            {% for category, message in messages %}
                                <div class="alert alert-{{ category }} mb-3">{{ message }}</div>
                            {% endfor %}
                        {% endif %}
                    {% endwith %}

                    <form method="POST">
                        <div class="mb-3">
                            <label for="otp" class="form-label">Enter OTP</label>
                            <input type="text" class="form-control form-control-lg text-center" id="otp" name="otp" maxlength="6" required placeholder="XXXXXX">
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Verify & Submit Application</button>
                    </form>
                    <div class="d-flex justify-content-between mt-3">
                        <a href="{{ url_for('doctor_resend_otp') }}" id="resendLink" class="text-decoration-none text-primary">Resend OTP</a>
                        <a href="{{ url_for('doctor_register') }}" class="text-decoration-none text-muted">Change Email</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const resendLink = document.getElementById('resendLink');
            let timeLeft = 30;
            const originalText = resendLink.innerText;

            function updateTimer() {
                if (timeLeft > 0) {
                    resendLink.innerText = `Resend in ${timeLeft}s`;
                    resendLink.style.pointerEvents = 'none';
                    resendLink.style.opacity = '0.5';
                    timeLeft--;
                    setTimeout(updateTimer, 1000);
                } else {
                    resendLink.innerText = originalText;
                    resendLink.style.pointerEvents = 'auto';
                    resendLink.style.opacity = '1';
                }
            }
            updateTimer();

            resendLink.addEventListener('click', function() {
                this.style.pointerEvents = 'none';
                this.innerText = 'Sending...';
            });
        });
    </script>
</body>
</html>
