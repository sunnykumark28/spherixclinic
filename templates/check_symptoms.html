{% extends 'layout.html' %}

{% block title %}Symptom Checker – DEV AI+{% endblock %}

{% block content %}
<div class="min-h-[80vh] bg-slate-50 py-16 px-4 sm:px-6 lg:px-8 relative overflow-hidden">
    <div class="absolute inset-0 opacity-10 bg-[radial-gradient(#3b82f6_1px,transparent_1px)] [background-size:20px_20px]"></div>
    
    <div class="max-w-3xl mx-auto bg-white rounded-3xl shadow-2xl overflow-hidden border border-slate-100 relative z-10">
        <div class="px-8 py-12">
            <div class="text-center mb-12">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-blue-50 text-blue-600 mb-4">
                    <i class="fas fa-stethoscope text-2xl"></i>
                </div>
                <h1 class="text-4xl font-extrabold text-slate-900 mb-4 tracking-tight">AI Symptom Checker</h1>
                <p class="text-lg text-slate-500 max-w-xl mx-auto">Describe your symptoms in detail, and our intelligent network will provide a preliminary analysis.</p>
            </div>

            <form id="symptomForm" method="POST" action="{{ url_for('check_symptoms') }}" class="space-y-8">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="space-y-2">
                        <label class="text-xs font-bold text-slate-500 uppercase tracking-widest ml-1">Current Age</label>
                        <input type="number" name="age" min="1" max="120" required placeholder="E.g. 32" 
                               class="w-full px-5 py-4 bg-slate-50 rounded-2xl border border-slate-200 focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none transition-all text-slate-700">
                    </div>

                    <div class="space-y-2">
                        <label class="text-xs font-bold text-slate-500 uppercase tracking-widest ml-1">Biological Sex</label>
                        <select name="gender" required class="w-full px-5 py-4 bg-slate-50 rounded-2xl border border-slate-200 focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none transition-all text-slate-700 appearance-none">
                            <option value="" disabled selected>Select gender</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="text-xs font-bold text-slate-500 uppercase tracking-widest ml-1">Primary Affected Area</label>
                    <select name="body_part" required class="w-full px-5 py-4 bg-slate-50 rounded-2xl border border-slate-200 focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none transition-all text-slate-700 appearance-none">
                        <option value="" disabled {% if not preselected_zone %}selected{% endif %}>Where does it hurt the most?</option>
                        <option value="Head/Neck" {% if preselected_zone == 'head' %}selected{% endif %}>Head & Neck</option>
                        <option value="Chest" {% if preselected_zone == 'chest' %}selected{% endif %}>Chest</option>
                        <option value="Abdomen/Stomach" {% if preselected_zone == 'stomach' %}selected{% endif %}>Abdomen & Stomach</option>
                        <option value="Arms/Hands">Arms & Hands</option>
                        <option value="Legs/Feet" {% if preselected_zone == 'limbs' %}selected{% endif %}>Legs & Feet</option>
                        <option value="Skin/General" {% if preselected_zone == 'skin' %}selected{% endif %}>Skin / General Body</option>
                    </select>
                </div>

                <div class="space-y-2">
                    <label class="text-xs font-bold text-slate-500 uppercase tracking-widest ml-1">Describe your symptoms</label>
                    <textarea name="symptoms" rows="4" required placeholder="E.g., I have had a severe headache and mild fever for the past 2 days..." 
                              class="w-full px-5 py-4 bg-slate-50 rounded-2xl border border-slate-200 focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none transition-all resize-none text-slate-700"></textarea>
                </div>

                <button type="submit" class="w-full bg-slate-900 hover:bg-blue-600 text-white font-bold py-5 px-6 rounded-2xl transition-all duration-300 shadow-[0_10px_20px_rgba(0,0,0,0.1)] hover:shadow-[0_10px_20px_rgba(37,99,235,0.3)] hover:-translate-y-1 flex justify-center items-center gap-3 group">
                    <span class="tracking-widest uppercase text-sm">Analyze Symptoms</span>
                    <i class="fas fa-arrow-right group-hover:translate-x-1 transition-transform"></i>
                </button>
            </form>
        </div>
    </div>
</div>

<script>
    document.getElementById('symptomForm').addEventListener('submit', function(e) {
        if (this.checkValidity()) {
            const btn = this.querySelector('button[type="submit"]');
            btn.innerHTML = '<i class="fas fa-circle-notch fa-spin text-xl"></i> <span class="tracking-widest uppercase text-sm ml-2">Processing Data...</span>';
            btn.classList.remove('bg-slate-900', 'hover:bg-blue-600');
            btn.classList.add('bg-blue-600', 'cursor-not-allowed', 'opacity-90');
        }
    });
</script>
{% endblock %}
