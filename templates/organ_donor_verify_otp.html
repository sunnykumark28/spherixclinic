<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Organ Donor OTP - DEV AI+</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { 
            background-color: #f0f9ff; /* sky-50 */
            display: flex; align-items: center; justify-content: center; height: 100vh; 
            font-family: 'Inter', sans-serif;
        }
        .card { border: none; border-radius: 15px; box-shadow: 0 10px 25px rgba(2, 132, 199, 0.1); }
        .btn-primary { background-color: #0284c7; border: none; padding: 10px; font-weight: 600; } /* sky-600 */
        .btn-primary:hover { background-color: #0369a1; } /* sky-700 */
        .text-sky-600 { color: #0284c7; }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card p-4">
                    <div class="text-center mb-4">
                        <h3 class="fw-bold text-sky-600">Verify Your Email</h3>
                        <p class="text-muted">We've sent a 6-digit code to your email.</p>
                    </div>
                    
                    {% with messages = get_flashed_messages(with_categories=true) %}
                        {% if messages %}
                            {% for category, message in messages %}
                                <div class="alert alert-{{ category }} mb-3">{{ message }}</div>
                            {% endfor %}
                        {% endif %}
                    {% endwith %}

                    <form method="POST">
                        <div class="mb-3">
                            <label for="otp" class="form-label">Enter OTP</label>
                            <input type="text" class="form-control form-control-lg text-center" id="otp" name="otp" maxlength="6" required placeholder="XXXXXX">
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Verify & Complete Pledge</button>
                    </form>
                    <div class="d-flex justify-content-between mt-3">
                        <a href="{{ url_for('organ_donor_resend_otp') }}" id="resendLink" class="text-decoration-none text-sky-600 fw-bold">Resend OTP</a>
                        <a href="{{ url_for('organ_donor_register') }}" class="text-decoration-none text-muted">Change Email</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const resendLink = document.getElementById('resendLink');
            resendLink.addEventListener('click', function() {
                this.innerText = 'Sending...';
                this.style.pointerEvents = 'none';
            });
        });
    </script>
</body>
</html>
