<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Spherix Clinic Hospital</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { 
            background-color: #ecfdf5;
            display: flex; align-items: center; justify-content: center; height: 100vh; 
            font-family: 'Inter', sans-serif;
        }
        .card { border: none; border-radius: 15px; box-shadow: 0 10px 25px rgba(5, 150, 105, 0.1); }
        .btn-primary { background-color: #059669; border: none; padding: 10px; font-weight: 600; }
        .btn-primary:hover { background-color: #047857; }
        .text-emerald-600 { color: #059669; }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card p-4">
                    <div class="text-center mb-4">
                        <h3 class="fw-bold text-emerald-600">Reset Password</h3>
                        <p class="text-muted">Enter your registered hospital email to receive an OTP.</p>
                    </div>
                    
                    {% with messages = get_flashed_messages(with_categories=true) %}
                        {% if messages %}
                            {% for category, message in messages %}
                                <div class="alert alert-{{ category }} mb-3">{{ message }}</div>
                            {% endfor %}
                        {% endif %}
                    {% endwith %}

                    <form method="POST">
                        <div class="mb-3">
                            <label class="form-label">Email Address</label>
                            <input type="email" name="email" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Send OTP</button>
                    </form>
                    <div class="text-center mt-3">
                        <a href="{{ url_for('hospital_login') }}" class="text-decoration-none text-muted">Back to Login</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
